name: TKYS QA Tests

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  # Hizli (saniyeler suren) kontrol: migration zincirinde tek head var mi? Veritabani gerektirmez.
  # Diger islerden bagimsizdir (needs yok): bu is kirmizi olursa digerleri de zaten kirmizi/atlanmis kalmaz,
  # zorunlu kontrol olarak tanimlanmis islerin "atlandi" sayilip merge'e izin vermesi engellenir.
  alembic-tek-head:
    name: Alembic Tek Head Kontrolu
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.13 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Python bagimliliklarini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Migration zincirinde tek head oldugunu dogrula
        run: python scripts/alembic_tek_head_kontrol.py

  qa-tests:
    name: Python 3.13 - QA Tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      DB_NAME: crkys_alembic_test
      PG_DUMP_PATH: ""
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.13 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Sistem kutuphanelerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Python bagimliliklarini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov==7.1.0

      - name: Python dosyalarini kontrol et
        run: |
          python -m compileall -q client server database/migrations scripts tests

      - name: Test icin gecici JWT anahtari olustur
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Guvenli QA testlerini ayri sureclerde calistir
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          COVERAGE_FILE: .coverage
        run: |
          set -euo pipefail

          # Her pytest süreci coverage verisini ayrı dosyaya yazar.
          export COVERAGE_FILE=".coverage"

          echo "=== UNIT (DOSYA BAZINDA) ==="
          for dosya in tests/unit/test_*.py; do
            ad="$(basename "$dosya" .py)"
            echo "=== $dosya ==="
            COVERAGE_FILE=".coverage.unit.$ad" python -m pytest "$dosya" -q --tb=short \
              --cov=server.sunucu --cov=server.guvenlik --cov=server.denetim \
              --cov-branch --cov-report=
          done

          echo "=== ACCEPTANCE (DOSYA BAZINDA) ==="
          for dosya in tests/acceptance/test_*.py; do
            ad="$(basename "$dosya" .py)"
            echo "=== $dosya ==="
            COVERAGE_FILE=".coverage.acceptance.$ad" python -m pytest "$dosya" -q --tb=short \
              --cov=server.sunucu --cov=server.guvenlik --cov=server.denetim \
              --cov-branch --cov-report=
          done

          echo "=== DIGER GUVENLI TESTLER (DOSYA BAZINDA) ==="
          for dosya in tests/integration/test_*.py tests/security/test_*.py; do
            case "$(basename "$dosya")" in
              test_veri_butunlugu_pg_quality.py|test_denetim_silinen_veri_pg_quality.py|test_giris_siniri_pg_quality.py|test_transaction_quality.py|test_randevu_transaction_quality.py|test_randevu_eszamanlilik_quality.py|test_audit_postgresql_quality.py|test_api_audit_rollback_quality.py|test_kullanici_personel_postgresql_quality.py|test_parola_sifirlama_pg_quality.py|test_ogrenci_yonetimi_postgresql_quality.py|test_faaliyet_turleri_postgresql_quality.py|test_admin_tum_izinler_pg_quality.py|test_kisisel_veri_ayrimi_pg_quality.py|test_randevu_iptal_durum_pg_quality.py|test_yas_terapi_gorusme_pg_quality.py|test_randevu_raporu_pg_quality.py|test_oda_kullanimi_pg_quality.py|test_girdi_fuzz_pg_quality.py|test_sema_dogrulama_pg_quality.py|test_yabanci_anahtar_indeks_pg_quality.py|test_kisitli_kullanici_pg_quality.py|test_gecici_parola_suresi_pg_quality.py|test_cihaz_odasi_atama_pg_quality.py|test_cihaz_odalari_psikolog_haric_pg_quality.py|test_psikolog_pasif_oda_pg_quality.py|test_psikolog_planli_randevu_pg_quality.py)
                continue ;;
            esac

            ad="$(basename "$dosya" .py)"
            grup="$(basename "$(dirname "$dosya")")"

            echo "=== $dosya ==="

            COVERAGE_FILE=".coverage.$grup.$ad" python -m pytest "$dosya" -q --tb=short \
              -k "not test_gercek_eszamanli_cihaz_rezervasyonu" \
              --cov=server.sunucu --cov=server.guvenlik --cov=server.denetim \
              --cov-branch --cov-report=
          done

          echo "=== COVERAGE BIRLESTIR ==="
          python -m coverage combine
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Coverage raporunu kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkys-qa-coverage
          path: coverage.xml
          if-no-files-found: ignore

  postgresql-tests:
    name: PostgreSQL Entegrasyon Testleri
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: crkys_alembic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crkys_alembic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: crkys_alembic_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres_test_password
      TKYS_PG_TEST_ONAY: EVET
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.13 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Sistem kutuphanelerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Python bagimliliklarini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test icin gecici JWT anahtari olustur
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Test veritabanini dogrula
        run: |
          python - <<'PY'
          import psycopg2
          from server.sunucu import VT_AYARLARI

          assert VT_AYARLARI["dbname"] == "crkys_alembic_test"
          assert VT_AYARLARI["host"] in ("127.0.0.1", "localhost")

          with psycopg2.connect(**VT_AYARLARI) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_database()")
                  assert cur.fetchone()[0] == "crkys_alembic_test"

          print("PostgreSQL test veritabani dogrulandi.")
          PY

      - name: Alembic migration uygula
        run: python -m alembic upgrade head

      - name: PostgreSQL testlerini calistir
        run: |
          python -m pytest -q --tb=short \
            tests/integration/test_ogrenci_yonetimi_postgresql_quality.py \
            tests/integration/test_faaliyet_turleri_postgresql_quality.py \
            tests/integration/test_admin_tum_izinler_pg_quality.py \
            tests/integration/test_kisisel_veri_ayrimi_pg_quality.py \
            tests/integration/test_yabanci_anahtar_indeks_pg_quality.py \
            tests/integration/test_kisitli_kullanici_pg_quality.py \
            tests/integration/test_girdi_fuzz_pg_quality.py \
            tests/integration/test_sema_dogrulama_pg_quality.py \
            tests/integration/test_randevu_iptal_durum_pg_quality.py \
            tests/integration/test_yas_terapi_gorusme_pg_quality.py \
            tests/integration/test_randevu_raporu_pg_quality.py \
            tests/integration/test_oda_kullanimi_pg_quality.py \
            tests/integration/test_gecici_parola_suresi_pg_quality.py \
            tests/integration/test_cihaz_odasi_atama_pg_quality.py \
            tests/integration/test_cihaz_odalari_psikolog_haric_pg_quality.py \
            tests/integration/test_psikolog_pasif_oda_pg_quality.py \
            tests/integration/test_psikolog_planli_randevu_pg_quality.py \
            tests/integration/test_veri_butunlugu_pg_quality.py \
            tests/integration/test_denetim_silinen_veri_pg_quality.py \
            tests/integration/test_giris_siniri_pg_quality.py
